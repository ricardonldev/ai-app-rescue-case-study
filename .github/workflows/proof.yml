name: proof
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Original schema generated by Lovable is vulnerable
        run: node verify.mjs ../migrations --expect-vulnerable
      - name: With the fix every attack is blocked and normal use works
        run: node verify.mjs ../migrations --fix --expect-secure
